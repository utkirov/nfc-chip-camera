<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Проверка подлинности — Camera Check</title>
  <meta name="description" content="Проверка подлинности камеры по NFC-метке Camera Check.">
  <meta name="theme-color" content="#0a0b0d">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/css/tailwind.css">
  <link rel="stylesheet" href="../shared/css/base.css">
</head>
<body class="font-sans antialiased min-h-screen">

<header class="sticky top-0 z-30 backdrop-blur-xl bg-ink/75 border-b border-white/5">
  <div class="max-w-lg mx-auto px-4 h-14 flex items-center justify-between">
    <a href="./" class="flex items-center gap-2">
      <span class="w-7 h-7 rounded-lg bg-gold/15 border border-gold/40 grid place-items-center">
        <svg viewBox="0 0 24 24" class="w-3.5 h-3.5 text-gold" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 8.5a8 8 0 0 1 0 7M9.5 6a12 12 0 0 1 0 12M13 4a16 16 0 0 1 0 16"/></svg>
      </span>
      <span class="font-display text-[13px] tracking-wide whitespace-nowrap">CAMERA CHECK<span class="text-gold">.</span></span>
    </a>
    <span class="text-[11px] uppercase tracking-[.18em] text-white/40 whitespace-nowrap">Проверка</span>
  </div>
</header>

<!-- Экран «проверяем…» -->
<div id="checking" class="fixed inset-0 z-40 bg-ink grid place-items-center hidden">
  <div class="text-center">
    <div class="relative w-24 h-24 mx-auto text-gold">
      <span class="ring"></span><span class="ring"></span><span class="ring"></span>
      <div class="absolute inset-5 rounded-full bg-gold/10 border border-gold/40 grid place-items-center">
        <svg viewBox="0 0 24 24" class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 8.5a8 8 0 0 1 0 7M9.5 6a12 12 0 0 1 0 12M13 4a16 16 0 0 1 0 16"/></svg>
      </div>
    </div>
    <p class="mt-8 text-white/70">Проверяем метку…</p>
    <p class="mt-1 text-xs text-white/35">Сверяем ID чипа и счётчик касаний</p>
  </div>
</div>

<main id="app" class="max-w-lg mx-auto px-4 pb-16"></main>

<footer class="max-w-lg mx-auto px-4 pb-10 text-center text-xs text-white/30">
  Проверка работает на технологии Camera Check NFC · <span id="year"></span>
</footer>

<script src="../shared/js/store.js"></script>
<script src="../shared/js/verify-engine.js"></script>
<script src="app.js"></script>
</body>
</html>
